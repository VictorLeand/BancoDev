services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: 1234
    volumes:
      - ./BaseDatos.sql:/docker-entrypoint-initdb.d/BaseDatos.sql

  rabbitmq:
    image: rabbitmq:3.13-alpine

  ms-clientes:
    build: ./ms-clientes
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clientes
      DB_PASSWORD: 1234
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    restart: on-failure

  ms-cuentas:
    build: ./ms-cuentas
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cuentas
      DB_PASSWORD: 1234
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    restart: on-failure