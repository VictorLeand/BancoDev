server:
  port: 8082

spring:
  application:
    name: ms-cuentas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cuentas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

mensajeria:
  exchange: clientes.exchange
  cola: cuentas.clientes.queue